name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify_tag:
    name: Verify Release Tag
    runs-on: ubuntu-latest
    outputs:
      is_on_main: ${{ steps.check.outputs.is_on_main }}
      changelog: ${{ steps.changelog.outputs.changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version From Tag
        id: tag
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check Branch
        id: check
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "is_on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_on_main=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure CHANGELOG entry exists and extract notes
        id: changelog
        if: ${{ steps.check.outputs.is_on_main == 'true' }}
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ steps.tag.outputs.version }}
          path: ./CHANGELOG.md

  ci:
    name: Lint & Format
    needs: verify_tag
    if: ${{ needs.verify_tag.outputs.is_on_main == 'true' }}
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and Release
    needs:
      - verify_tag
      - ci
    if: ${{ always() && needs.verify_tag.outputs.is_on_main == 'true' && needs.ci.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Foreman
        uses: Roblox/setup-foreman@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allow-external-github-orgs: true

      - name: Cache Foreman tools
        uses: actions/cache@v5.0.4
        with:
          path: ~/.foreman
          key: tools-${{ hashFiles('foreman.toml') }}

      - name: Install tools
        run: foreman install

      - name: Build RBXM
        run: rojo build -o BehaviourTree.rbxm

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ needs.verify_tag.outputs.changelog }}
          files: BehaviourTree.rbxm
