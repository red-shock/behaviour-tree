name: Lint & Format

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.3.0

      - name: Setup Foreman
        uses: Roblox/setup-foreman@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allow-external-github-orgs: true

      - name: Cache Foreman tools
        uses: actions/cache@v5.0.4
        with:
          path: ~/.foreman
          key: tools-${{ hashFiles('foreman.toml') }}

      - name: Install tools
        run: foreman install

      - name: Lint
        run: |
          selene generate-roblox-std
          selene src

      - name: Check format
        run: stylua --check src
